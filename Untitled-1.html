<!DOCTYPE html>
<html>
<head>
    <title>My Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f2eaff;
            margin: 0;
        }

        header {
            background: purple;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 25px;
            width: 150px;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Dashboard</h1>
        <p>Welcome to Student Portal</p>
    </header>

    <nav>
        Home | Students | Courses | Contact
    </nav>

    <div class="container">

        <div class="card">
            <h3>Students</h3>
            <p>100 Students</p>
        </div>

        <div class="card">
            <h3>Courses</h3>
            <p>5 Courses</p>
        </div>

        <div class="card">
            <h3>Results</h3>
            <p>View Results</p>
        </div>

    </div>

</body>
</html>
